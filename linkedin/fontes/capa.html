<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111113; --bg-2: #1b1b1f; --glow: rgba(255,255,255,.06);
    --text: #f4f4f5; --muted: #a1a1aa; --faint: rgba(255,255,255,.14);
    --accent: #c4b5fd; --node: #f4f4f5;
  }
  .roxo {
    --bg: #1a1224; --bg-2: #2a1f3d; --glow: rgba(156,106,214,.22);
    --text: #f2ecfa; --muted: #b9a9cf; --faint: rgba(180,140,240,.22);
    --accent: #b48cf0; --node: #b48cf0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  .capa {
    position: relative; width: 1584px; height: 396px; overflow: hidden;
    background:
      radial-gradient(ellipse 760px 420px at 1180px 60px, var(--glow), transparent 70%),
      linear-gradient(120deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--text); font-family: "Lato", sans-serif;
  }
  .ruido {
    position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 22px 22px;
    mask-image: linear-gradient(90deg, transparent 15%, #000 60%);
  }
  .conteudo {
    position: absolute; left: 560px; right: 110px; top: 52px; bottom: 46px;
    display: flex; flex-direction: column;
  }
  .rotulo {
    font-family: "JetBrains Mono", monospace; font-size: 17px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--muted);
  }
  .rotulo span { color: var(--accent); }
  h1 {
    margin-top: 18px;
    font-family: "Montserrat", sans-serif; font-weight: 800;
    font-size: 45px; line-height: 1.12; letter-spacing: -.6px; white-space: nowrap;
  }
  h1 small {
    display: block; font-weight: 600; font-size: 29px; letter-spacing: -.3px;
    color: var(--muted); margin-top: 6px;
  }
  .fluxo {
    margin-top: auto; position: relative;
    display: flex; justify-content: space-between;
  }
  .fluxo::before {
    content: ""; position: absolute; left: 6px; right: 6px; top: 6px;
    height: 1px; background: var(--faint);
  }
  .etapa { position: relative; display: flex; flex-direction: column; gap: 6px; }
  .etapa::before {
    content: ""; width: 11px; height: 11px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--node); margin-bottom: 6px;
  }
  .etapa b {
    font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 16px;
    letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
  }
  .etapa span { font-size: 22px; color: var(--text); }
  .url {
    position: absolute; right: 130px; top: 56px;
    font-family: "JetBrains Mono", monospace; font-size: 15px; color: var(--muted);
  }
</style>
</head>
<body>
  <div class="capa" id="capa">
    <div class="ruido"></div>
    <div class="conteudo">
      <div class="rotulo">Engenharia de software <span>/</span> Ensino de programação</div>
      <h1>Construo sistemas de ponta a ponta.<small>E ensino programação para quem está começando.</small></h1>
      <div class="fluxo">
        <div class="etapa"><b>Domínio</b><span>Java · Spring Boot</span></div>
        <div class="etapa"><b>Interface</b><span>Angular · React</span></div>
        <div class="etapa"><b>Dados</b><span>PostgreSQL</span></div>
        <div class="etapa"><b>Nuvem</b><span>AWS · Terraform</span></div>
        <div class="etapa"><b>Entrega</b><span>Docker · CI/CD</span></div>
      </div>
    </div>
  </div>
  <script>
    if (location.hash === "#roxo") document.getElementById("capa").classList.add("roxo");
  </script>
</body>
</html>
