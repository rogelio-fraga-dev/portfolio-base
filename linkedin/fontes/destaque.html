<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111113; --bg-2: #1b1b1f; --glow: rgba(255,255,255,.06);
    --text: #f4f4f5; --muted: #a1a1aa; --faint: rgba(255,255,255,.14);
    --accent: #c4b5fd; --frame: rgba(255,255,255,.16);
  }
  .roxo {
    --bg: #1a1224; --bg-2: #2a1f3d; --glow: rgba(156,106,214,.22);
    --text: #f2ecfa; --muted: #b9a9cf; --faint: rgba(180,140,240,.22);
    --accent: #b48cf0; --frame: rgba(180,140,240,.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 628px; overflow: hidden; }
  .card {
    position: relative; width: 1200px; height: 628px; overflow: hidden;
    background:
      radial-gradient(ellipse 700px 500px at 950px 100px, var(--glow), transparent 70%),
      linear-gradient(120deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--text); font-family: "Lato", sans-serif;
  }
  .ruido {
    position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .texto {
    position: absolute; left: 80px; top: 92px; bottom: 88px; width: 650px;
    display: flex; flex-direction: column;
  }
  .rotulo {
    font-family: "JetBrains Mono", monospace; font-size: 19px; letter-spacing: 4px;
    text-transform: uppercase; color: var(--muted);
  }
  .rotulo span { color: var(--accent); }
  h1 {
    margin-top: 26px; font-family: "Montserrat", sans-serif; font-weight: 800;
    font-size: 60px; line-height: 1.1; letter-spacing: -.8px;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .casos { margin-top: auto; display: flex; flex-wrap: wrap; gap: 12px; }
  .casos span {
    font-family: "JetBrains Mono", monospace; font-size: 23px;
    padding: 9px 16px; border: 1px solid var(--faint); border-radius: 8px; color: var(--text);
  }
  .url {
    margin-top: 24px; font-family: "JetBrains Mono", monospace; font-size: 24px; color: var(--muted);
  }
  .foto {
    position: absolute; right: 80px; top: 92px; width: 360px; height: 444px;
    border-radius: 18px; overflow: hidden; border: 1px solid var(--frame);
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
  }
  .foto img { width: 100%; height: 100%; object-fit: cover; object-position: 62% 30%; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="ruido"></div>
    <div class="texto">
      <div class="rotulo">Portfólio <span>/</span> Estudos de caso</div>
      <h1>Sistemas reais, do <em>domínio</em> ao <em>deploy</em>.</h1>
      <div class="casos">
        <span>InovaLayer</span><span>Razor</span><span>ObraCerta</span><span>Sistema de Aulas</span>
      </div>
      <div class="url">rogeliofragadev.com.br</div>
    </div>
    <div class="foto"><img src="../../imagens/avatar.jpg" alt=""></div>
  </div>
  <script>
    if (location.hash === "#roxo") document.getElementById("card").classList.add("roxo");
  </script>
</body>
</html>
