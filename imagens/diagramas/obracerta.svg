<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" width="1000" height="390"
     aria-label="Arquitetura do ObraCerta: o navegador e o aplicativo instalável falam com o Next.js, que funciona como BFF e guarda o token em cookie httpOnly. O Next.js chama a API em NestJS, organizada em módulos hexagonais, que usa PostgreSQL com PostGIS para a busca geográfica, Redis com BullMQ para filas e um armazenamento compatível com S3 para as fotos. Os contratos Zod são compartilhados entre o front e o back, e a API expõe métricas para o Prometheus.">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9c6ad6"/>
    </marker>
    <style>
      .cx { fill: rgba(156,106,214,.12); stroke: rgba(156,106,214,.55); stroke-width: 1.5; rx: 12; }
      .cx-ext { fill: rgba(255,255,255,.04); stroke: rgba(255,255,255,.22); }
      .zona { fill: rgba(156,106,214,.05); stroke: rgba(156,106,214,.35); stroke-dasharray: 6 5; stroke-width: 1.5; rx: 14; }
      .t { font-family: "Segoe UI", Roboto, Arial, sans-serif; fill: #ece9f1; font-size: 16px; font-weight: 700; }
      .s { font-family: "Segoe UI", Roboto, Arial, sans-serif; fill: rgba(236,233,241,.78); font-size: 13px; }
      .rot { font-family: "Segoe UI", Roboto, Arial, sans-serif; fill: #b98cf0; font-size: 12px; font-weight: 700; letter-spacing: .06em; }
      .lig { stroke: #9c6ad6; stroke-width: 2; fill: none; marker-end: url(#seta); }
      .lig-leve { stroke: rgba(156,106,214,.6); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#seta); }
    </style>
  </defs>

  <text class="rot" x="24" y="26">OBRACERTA · MONOREPO HEXAGONAL</text>

  <!-- contratos compartilhados -->
  <rect class="zona" x="252" y="52" width="470" height="286"/>
  <text class="rot" x="268" y="76">CONTRATOS ZOD COMPARTILHADOS (packages/shared)</text>

  <rect class="cx cx-ext" x="24" y="120" width="200" height="96"/>
  <text class="t" x="44" y="152">Navegador / PWA</text>
  <text class="s" x="44" y="174">mobile-first,</text>
  <text class="s" x="44" y="192">instalável, sem app nativo</text>

  <rect class="cx" x="272" y="100" width="200" height="100"/>
  <text class="t" x="292" y="132">Next.js 15</text>
  <text class="s" x="292" y="154">SSR + BFF</text>
  <text class="s" x="292" y="172">cookie httpOnly</text>

  <rect class="cx" x="502" y="100" width="200" height="100"/>
  <text class="t" x="522" y="132">NestJS</text>
  <text class="s" x="522" y="154">23 módulos de domínio</text>
  <text class="s" x="522" y="172">hexagonal / DDD</text>

  <rect class="cx" x="752" y="60" width="224" height="86"/>
  <text class="t" x="772" y="90">PostgreSQL + PostGIS</text>
  <text class="s" x="772" y="112">busca geográfica</text>
  <text class="s" x="772" y="130">e textual (pg_trgm)</text>

  <rect class="cx" x="752" y="164" width="224" height="86"/>
  <text class="t" x="772" y="194">Redis + BullMQ</text>
  <text class="s" x="772" y="216">filas, cache e OTP</text>
  <text class="s" x="772" y="234">expiração de pedidos</text>

  <rect class="cx" x="752" y="268" width="224" height="80"/>
  <text class="t" x="772" y="298">S3 / MinIO</text>
  <text class="s" x="772" y="320">fotos de perfil e obra</text>

  <rect class="cx" x="272" y="248" width="430" height="80"/>
  <text class="t" x="292" y="278">Observabilidade</text>
  <text class="s" x="292" y="300">/metrics no Prometheus · logs com correlation id · trilha de auditoria</text>

  <path class="lig" d="M 228 166 L 266 152"/>
  <path class="lig" d="M 476 150 L 496 150"/>
  <path class="lig" d="M 706 140 L 746 110"/>
  <path class="lig" d="M 706 160 L 746 200"/>
  <path class="lig-leve" d="M 706 180 L 746 300"/>
  <path class="lig-leve" d="M 600 204 L 600 244"/>
</svg>
