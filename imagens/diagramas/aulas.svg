<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" width="1000" height="390"
     aria-label="Arquitetura do Sistema de Aulas: o aluno acessa pelo navegador ou celular, o Nginx na EC2 encaminha para a aplicação Spring Boot, que lê e grava no PostgreSQL com migrações Flyway. Os quizzes e slides ficam em volumes fora da imagem Docker. O deploy vem do GitHub Actions por OIDC e SSM, com pg_dump antes de cada migração.">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9c6ad6"/>
    </marker>
    <style>
      .cx { fill: rgba(156,106,214,.12); stroke: rgba(156,106,214,.55); stroke-width: 1.5; rx: 12; }
      .cx-ext { fill: rgba(255,255,255,.04); stroke: rgba(255,255,255,.22); }
      .zona { fill: rgba(156,106,214,.05); stroke: rgba(156,106,214,.35); stroke-dasharray: 6 5; stroke-width: 1.5; rx: 14; }
      .t { font-family: "Segoe UI", Roboto, Arial, sans-serif; fill: #ece9f1; font-size: 16px; font-weight: 700; }
      .s { font-family: "Segoe UI", Roboto, Arial, sans-serif; fill: rgba(236,233,241,.78); font-size: 13px; }
      .rot { font-family: "Segoe UI", Roboto, Arial, sans-serif; fill: #b98cf0; font-size: 12px; font-weight: 700; letter-spacing: .06em; }
      .lig { stroke: #9c6ad6; stroke-width: 2; fill: none; marker-end: url(#seta); }
      .lig-leve { stroke: rgba(156,106,214,.6); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#seta); }
    </style>
  </defs>

  <text class="rot" x="24" y="26">SISTEMA DE AULAS · ARQUITETURA</text>

  <!-- zona da EC2 -->
  <rect class="zona" x="252" y="52" width="470" height="180"/>
  <text class="rot" x="268" y="76">AWS EC2 · DOCKER COMPOSE</text>

  <!-- aluno -->
  <rect class="cx cx-ext" x="24" y="96" width="200" height="86"/>
  <text class="t" x="44" y="128">Aluno</text>
  <text class="s" x="44" y="150">navegador ou celular,</text>
  <text class="s" x="44" y="168">sem instalar nada</text>

  <!-- nginx -->
  <rect class="cx" x="272" y="96" width="180" height="86"/>
  <text class="t" x="292" y="128">Nginx</text>
  <text class="s" x="292" y="150">proxy reverso</text>
  <text class="s" x="292" y="168">e TLS</text>

  <!-- app -->
  <rect class="cx" x="492" y="96" width="210" height="86"/>
  <text class="t" x="512" y="128">Spring Boot 3.4</text>
  <text class="s" x="512" y="150">Thymeleaf · sessão</text>
  <text class="s" x="512" y="168">editor · quiz · prazos</text>

  <!-- banco -->
  <rect class="cx" x="752" y="96" width="224" height="86"/>
  <text class="t" x="772" y="128">PostgreSQL 16</text>
  <text class="s" x="772" y="150">81 migrações Flyway</text>
  <text class="s" x="772" y="168">volume nomeado</text>

  <!-- volumes -->
  <rect class="cx" x="492" y="248" width="210" height="82"/>
  <text class="t" x="512" y="278">Volumes no host</text>
  <text class="s" x="512" y="300">quizzes, slides e decks</text>
  <text class="s" x="512" y="318">fora da imagem</text>

  <!-- ci -->
  <rect class="cx" x="24" y="248" width="420" height="82"/>
  <text class="t" x="44" y="278">GitHub Actions</text>
  <text class="s" x="44" y="300">OIDC (sem chave da AWS) · deploy por SSM</text>
  <text class="s" x="44" y="318">pg_dump antes de migrar · trava de horário de aula</text>

  <path class="lig" d="M 228 139 L 266 139"/>
  <path class="lig" d="M 456 139 L 486 139"/>
  <path class="lig" d="M 706 139 L 746 139"/>
  <path class="lig-leve" d="M 597 244 L 597 188"/>
  <path class="lig-leve" d="M 448 280 L 486 280"/>
</svg>
